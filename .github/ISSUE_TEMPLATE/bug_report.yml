name: Bug report
description: File a bug report to help us improve CROW
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear steps and inputs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What CROW version are you using?
      placeholder: 1.0.0
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      render: shell
